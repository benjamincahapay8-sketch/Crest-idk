name: Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build EclipseCrest.csproj -c Release
      - run: |
          mkdir out/EclipseCrest/Sprites
          mkdir out/CustomCrest/Sprites
          copy bin/Release/net48/EclipseCrest.dll out/EclipseCrest/
          copy MeteorShock.png,MoonWhirl.png,ThreadLunge.png,VoidTendrils.png,UmbralBurst.png out/EclipseCrest/Sprites/
          copy Custom_Crest.png,CustomCrestSilhouette.png out/CustomCrest/Sprites/
      - uses: actions/upload-artifact@v4
        with:
          name: EclipseCrest
          path: out
